- name: setenforce 
  ansible.builtin.command: setenforce 0

- name: Start Service
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped


- name: Install MySQL Server
  ansible.builtin.dnf:
    name: mysql-server
    state: latest

- name: Start MySQL
  ansible.builtin.systemd_service:
    name: mysqld
    state: started
    enabled: yes

#- name: Setup MySQL Root Password
#  ansible.builtin.shell: mysql_secure_installation --set-root-pass {{ lookup('community.hashi_vault.hashi_vault', 'secret=roboshop-{{ env }}/data/{{ app_name }}:password token={{ token }} url=http://vault-int.vidyapractice.online:8200') }}

- name: Setup MySQL Root Password
  ansible.builtin.shell: >
    mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY
    '{{ lookup('community.hashi_vault.hashi_vault', 'secret=roboshop-' + env + '/data/' + app_name + ':password token=' + token + ' url=http://vault-int.vidyapractice.online:8200') }}';"
  no_log: true

- name: Create remote root user and grant privileges
  ansible.builtin.shell: >
    mysql -u root -p'{{ lookup('community.hashi_vault.hashi_vault', 'secret=roboshop-' + env + '/data/' + app_name + ' token=' + token + ' url=http://vault-int.vidyapractice.online:8200') }}' -e "
    CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '{{ lookup('community.hashi_vault.hashi_vault', 'secret=roboshop-' + env + '/data/' + app_name + ' token=' + token + ' url=http://vault-int.vidyapractice.online:8200') }}';
    GRANT ALL PRIVILEGES ON . TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;"
  no_log: true

